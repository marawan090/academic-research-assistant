<!DOCTYPE html>
<html lang="en" class="h-full bg-zinc-950 text-zinc-100 dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Access & Credits Control</title>
  <link rel="icon" type="image/jpeg" href="/static/axiom_logo.jpg">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    html { color-scheme: dark; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: #09090b; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="h-full bg-zinc-950 text-zinc-100 flex flex-col min-h-screen">

  <!-- SLIM TOP BAR -->
  <header class="h-12 flex-none border-b border-zinc-800 bg-zinc-950/90 backdrop-blur-md sticky top-0 z-40 px-4 sm:px-6">
    <div class="max-w-7xl mx-auto h-full flex items-center justify-between gap-3">
      <div class="flex items-center space-x-2.5 min-w-0">
        <div class="relative w-7 h-7 rounded-md overflow-hidden ring-1 ring-zinc-700 shrink-0 bg-black">
          <img src="/static/axiom_logo.jpg" alt="Axiom Logo" class="w-full h-full object-cover" />
        </div>
        <h1 class="text-sm font-semibold tracking-tight truncate">Admin <span class="text-zinc-500 font-mono text-xs">/ access · credits</span></h1>
        <span class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-zinc-900 text-zinc-400 border border-zinc-800">RESTRICTED</span>
      </div>
      <div class="flex items-center space-x-1.5 text-xs shrink-0">
        <span id="live-clock" class="hidden md:inline font-mono text-[11px] text-zinc-500">--:--:--</span>
        <button id="btn-toggle-autorefresh" class="flex items-center space-x-1.5 px-2 py-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition cursor-pointer" title="Toggle auto-refresh">
          <span id="autorefresh-dot" class="w-2 h-2 rounded-full bg-emerald-500"></span>
          <span id="autorefresh-label" class="font-mono text-[11px]">5s</span>
        </button>
        <button id="btn-manual-refresh" class="p-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition cursor-pointer" title="Refresh now">
          <i data-lucide="refresh-cw" id="refresh-icon" class="w-4 h-4"></i>
        </button>
        <a href="/" class="hidden sm:flex items-center space-x-1 px-2 py-1.5 rounded-md text-zinc-400 hover:text-zinc-100 hover:bg-zinc-900 transition text-xs">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i><span>App</span>
        </a>
        <button id="btn-admin-logout" class="flex items-center space-x-1 px-2 py-1.5 rounded-md text-zinc-400 hover:text-rose-300 hover:bg-zinc-900 transition cursor-pointer text-xs">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i><span>Logout</span>
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-5">

    <!-- INVITE CODES STRIP -->
    <section class="bg-zinc-900/60 border border-zinc-800 rounded-lg p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-semibold text-zinc-200">Invite Codes <span id="codes-count" class="font-mono text-zinc-500"></span></h2>
        <span class="text-[11px] font-mono text-zinc-500">click a code to revoke</span>
      </div>
      <div id="codes-grid" class="flex flex-wrap gap-1.5"></div>
    </section>

    <!-- 24H ACTIVITY TABLE -->
    <section class="bg-zinc-900/60 border border-zinc-800 rounded-lg p-4 space-y-3">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="flex items-center space-x-2">
          <h2 class="text-xs font-semibold text-zinc-200">Live & 24h Activity</h2>
          <span id="activity-count-badge" class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-zinc-800 text-zinc-400 border border-zinc-700">0 rows</span>
        </div>
        <input type="text" id="search-activity-input" placeholder="Filter email, IP, code…"
          class="bg-zinc-950 border border-zinc-800 rounded-md px-2.5 py-1 text-xs font-mono text-zinc-200 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 w-full sm:w-56" />
      </div>
      <div class="overflow-x-auto rounded-md border border-zinc-800">
        <table class="w-full text-left text-xs">
          <thead class="bg-zinc-950 text-zinc-500 uppercase tracking-wider font-mono text-[10px] border-b border-zinc-800">
            <tr>
              <th class="p-2.5">User</th>
              <th class="p-2.5">Client IP</th>
              <th class="p-2.5">Access Code</th>
              <th class="p-2.5">Credits</th>
              <th class="p-2.5">Last Active</th>
              <th class="p-2.5">Status</th>
              <th class="p-2.5 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="activity-table-body" class="divide-y divide-zinc-800/70">
            <tr><td colspan="7" class="p-6 text-center text-zinc-600 font-mono text-xs">Loading activity…</td></tr>
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- PASSWORD MODAL -->
  <div id="passkey-modal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 backdrop-blur-md p-4 hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl max-w-sm w-full p-6 shadow-2xl space-y-4 text-center">
      <div class="w-10 h-10 rounded-lg bg-zinc-800 border border-zinc-700 flex items-center justify-center mx-auto text-zinc-300">
        <i data-lucide="lock" class="w-5 h-5"></i>
      </div>
      <div>
        <h3 class="text-sm font-semibold text-zinc-100">Admin Access</h3>
        <p class="text-[11px] text-zinc-500 mt-1">Enter the admin password to continue.</p>
      </div>
      <form id="passkey-form" class="space-y-3">
        <input type="password" id="passkey-input" placeholder="Admin password" autocomplete="current-password"
          class="w-full bg-zinc-950 border border-zinc-800 rounded-md px-3 py-2 text-xs font-mono text-zinc-100 placeholder-zinc-600 focus:outline-none focus:border-zinc-600 text-center" required />
        <div id="passkey-error" class="text-rose-400 text-[11px] font-mono hidden">Incorrect password. Access denied.</div>
        <button type="submit" class="w-full py-2 rounded-md bg-zinc-100 hover:bg-white text-zinc-900 font-semibold text-xs transition cursor-pointer">Authenticate</button>
      </form>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col space-y-2 pointer-events-none"></div>

  <script>
    let activeKey = null;
    let autoRefreshEnabled = true;
    let refreshIntervalTimer = null;
    let creditStep = 5;

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const bg = type === 'error' ? 'bg-zinc-900 border-rose-700 text-rose-100' :
                 type === 'success' ? 'bg-zinc-900 border-emerald-700 text-emerald-100' :
                 'bg-zinc-900 border-zinc-700 text-zinc-100';
      toast.className = `${bg} border rounded-lg px-3 py-2 text-xs shadow-lg pointer-events-auto transition-all flex items-center space-x-2`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 250); }, 3000);
    }

    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    function getCookie(name) {
      const matches = document.cookie.match(new RegExp('(?:^|; )' + name.replace(/([\.$?*|{}\(\)\[\]\\\/\+^])/g, '\\$1') + '=([^;]*)'));
      return matches ? decodeURIComponent(matches[1]) : undefined;
    }

    function setCookie(name, value, days = 30) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = `${name}=${encodeURIComponent(value)}; expires=${d.toUTCString()}; path=/; SameSite=Strict`;
    }

    function deleteCookie(name) {
      document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
    }

    function resolveAdminKey() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlKey = urlParams.get('key') || urlParams.get('admin_key');
      if (urlKey) {
        activeKey = urlKey.trim();
        setCookie('axiom_admin_session', activeKey);
        window.history.replaceState({}, document.title, window.location.pathname);
        return activeKey;
      }
      const cookieKey = getCookie('axiom_admin_session');
      if (cookieKey) {
        activeKey = cookieKey.trim();
        return activeKey;
      }
      return null;
    }

    function updateLiveClock() {
      const el = document.getElementById('live-clock');
      if (el) el.textContent = new Date().toTimeString().split(' ')[0];
    }
    setInterval(updateLiveClock, 1000);
    updateLiveClock();

    async function adminFetch(endpoint, options = {}) {
      const headers = Object.assign({}, options.headers || {});
      if (activeKey) headers['X-Admin-Key'] = activeKey;
      options.headers = headers;
      options.credentials = 'same-origin';
      const res = await fetch(endpoint, options);
      if (res.status === 404 || res.status === 401) {
        showPasskeyModal();
        throw new Error('Authentication required');
      }
      return res;
    }

    function statusPill(status) {
      if (status === 'Active') return '<span class="inline-flex px-1.5 py-0.5 rounded text-[10px] font-mono bg-emerald-500/10 text-emerald-400 border border-emerald-500/25">Active</span>';
      if (status === 'Revoked') return '<span class="inline-flex px-1.5 py-0.5 rounded text-[10px] font-mono bg-rose-500/10 text-rose-400 border border-rose-500/25">Revoked</span>';
      return '<span class="inline-flex px-1.5 py-0.5 rounded text-[10px] font-mono bg-zinc-800 text-zinc-500 border border-zinc-700">Unknown</span>';
    }

    function fmtTime(iso) {
      if (!iso) return '—';
      try {
        const d = new Date(iso);
        return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      } catch (_) { return String(iso).slice(0, 16); }
    }

    async function fetchTelemetry() {
      const icon = document.getElementById('refresh-icon');
      if (icon) icon.classList.add('animate-spin');
      try {
        const res = await adminFetch('/api/admin/telemetry');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        renderTelemetry(await res.json());
      } catch (err) {
        console.warn('Telemetry fetch error:', err.message);
      } finally {
        if (icon) setTimeout(() => icon.classList.remove('animate-spin'), 400);
      }
    }

    function renderTelemetry(data) {
      renderCodes(data.codes || []);
      renderActivity(data.rows || []);
      if (window.lucide) lucide.createIcons();
    }

    function renderCodes(codes) {
      const grid = document.getElementById('codes-grid');
      const count = document.getElementById('codes-count');
      if (!grid) return;
      const active = codes.filter(c => c.active !== false).length;
      if (count) count.textContent = `${active}/${codes.length} active`;
      if (!codes.length) {
        grid.innerHTML = '<span class="text-[11px] font-mono text-zinc-600">No codes provisioned.</span>';
        return;
      }
      grid.innerHTML = '';
      codes.forEach(c => {
        const isActive = c.active !== false;
        const b = document.createElement('button');
        b.type = 'button';
        b.title = isActive ? `Revoke ${c.code}` : `${c.code} (revoked)`;
        b.className = isActive
          ? 'px-2 py-1 rounded-md text-[10px] font-mono bg-zinc-800 text-zinc-300 border border-zinc-700 hover:border-rose-500/60 hover:text-rose-300 transition cursor-pointer'
          : 'px-2 py-1 rounded-md text-[10px] font-mono bg-transparent text-zinc-600 border border-zinc-800 line-through cursor-default';
        b.textContent = c.code;
        if (isActive) b.addEventListener('click', () => deactivateCode(c.code));
        grid.appendChild(b);
      });
    }

    function renderActivity(rows) {
      const tbody = document.getElementById('activity-table-body');
      const badge = document.getElementById('activity-count-badge');
      if (badge) badge.textContent = `${rows.length} row${rows.length === 1 ? '' : 's'}`;
      if (!tbody) return;
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-zinc-600 font-mono text-xs">No activity in the last 24 hours.</td></tr>';
        return;
      }
      tbody.innerHTML = '';
      rows.forEach(r => {
        const tr = document.createElement('tr');
        tr.className = 'hover:bg-zinc-900/60 transition';
        tr.dataset.search = `${r.user_email || ''} ${r.user_name || ''} ${r.client_ip || ''} ${r.access_code || ''}`.toLowerCase();
        const creditCell = (r.credits === -1 || r.credits === undefined || !r.user_id)
          ? '<span class="font-mono text-zinc-600">—</span>'
          : `<button data-act="custom" data-uid="${escapeHtml(r.user_id)}" data-balance="${escapeHtml(String(r.credits))}" title="Click to set exact balance" class="font-mono text-zinc-200 hover:text-white bg-zinc-800 hover:bg-zinc-700 border border-zinc-700 rounded px-1.5 py-0.5 transition cursor-pointer">${escapeHtml(String(r.credits))}</button>`;
        const idRef = r.user_id || r.user_email || r.access_code || '';
        tr.innerHTML = `
          <td class="p-2.5"><span class="block text-zinc-200">${escapeHtml(r.user_email || '—')}</span><span class="block text-[11px] text-zinc-500">${escapeHtml(r.user_name || '')}</span></td>
          <td class="p-2.5 font-mono text-zinc-300">${escapeHtml(r.client_ip || '—')}</td>
          <td class="p-2.5 font-mono text-[11px] text-zinc-300">${escapeHtml(r.access_code || '—')}</td>
          <td class="p-2.5">${creditCell}</td>
          <td class="p-2.5 font-mono text-[11px] text-zinc-500 whitespace-nowrap" title="${escapeHtml(r.last_action || '')} · ${escapeHtml(String(r.requests_24h || 0))} req/24h">${escapeHtml(fmtTime(r.last_active))}</td>
          <td class="p-2.5">${statusPill(r.status)}</td>
          <td class="p-2.5 text-right whitespace-nowrap">
            <span class="inline-flex items-center gap-1">
              <button data-act="dec5" data-uid="${escapeHtml(r.user_id || '')}" title="−5 credits" class="px-1.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 text-[11px] font-mono transition cursor-pointer">−5</button>
              <button data-act="inc10" data-uid="${escapeHtml(r.user_id || '')}" title="+10 credits" class="px-1.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700 text-[11px] font-mono transition cursor-pointer">+10</button>
              <button data-act="revoke" data-code="${escapeHtml(r.access_code || '')}" title="Deactivate code" class="px-1.5 py-1 rounded bg-rose-950/40 hover:bg-rose-900/60 text-rose-300 border border-rose-800/50 text-[11px] transition cursor-pointer">Revoke</button>
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
      applyActivityFilter();
    }

    async function deactivateCode(code) {
      if (!code || code === '—') { showToast('No code on this row.', 'error'); return; }
      if (!confirm(`Deactivate ${code}? Access ends immediately.`)) return;
      try {
        const res = await adminFetch('/api/admin/code/deactivate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || data.error || `HTTP ${res.status}`);
        showToast(data.message || 'Code deactivated.', 'success');
        fetchTelemetry();
      } catch (err) {
        showToast(`Deactivate failed: ${err.message}`, 'error');
      }
    }

    // Direct per-user credit control: POST /api/admin/users/credits
    // {user_id, action: "adjust"|"set", amount}. Optimistic UI + toast.
    async function usersCredits(userId, action, amount, btn) {
      if (!userId) { showToast('No onboarded user on this row.', 'error'); return; }
      if (btn) btn.disabled = true;
      try {
        const res = await adminFetch('/api/admin/users/credits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId, action, amount })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || data.error || `HTTP ${res.status}`);
        // Optimistic inline balance update (full refresh follows).
        const row = btn ? btn.closest('tr') : null;
        const badge = row ? row.querySelector('[data-act="custom"]') : null;
        if (badge) {
          badge.textContent = data.credits;
          badge.setAttribute('data-balance', data.credits);
        }
        showToast(
          action === 'set' ? `Balance set → ${data.credits}` : `Credits ${amount > 0 ? '+' : ''}${amount} → ${data.credits}`,
          'success'
        );
        fetchTelemetry();
      } catch (err) {
        showToast(`Credit update failed: ${err.message}`, 'error');
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function customCreditsPrompt(uid, current) {
      if (!uid) { showToast('No onboarded user on this row.', 'error'); return; }
      const raw = prompt(`Set or adjust credits (current: ${current}).\nEnter a number to adjust (+/- allowed), or =N to set exact:`, '+10');
      if (raw === null) return;
      const text = raw.trim();
      if (!text) return;
      const setMatch = text.match(/^=\s*(-?\d+)$/);
      if (setMatch) {
        usersCredits(uid, 'set', parseInt(setMatch[1], 10), null);
        return;
      }
      if (!/^[-+]?\d+$/.test(text)) { showToast('Enter an integer like +10, -5, or =25.', 'error'); return; }
      usersCredits(uid, 'adjust', parseInt(text, 10), null);
    }

    async function adjustCredits(ref, delta) {
      if (!ref) { showToast('No user reference on this row.', 'error'); return; }
      const payload = { delta };
      if (/^[0-9a-f-]{8,}$/i.test(ref) && ref.includes('-')) payload.user_id = ref;
      else if (ref.includes('@')) payload.email = ref;
      else payload.code = ref;
      try {
        const res = await adminFetch('/api/admin/credits/adjust', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.detail || data.error || `HTTP ${res.status}`);
        showToast(`Credits ${delta > 0 ? '+' : ''}${delta} → ${data.credits}`, 'success');
        fetchTelemetry();
      } catch (err) {
        showToast(`Credit update failed: ${err.message}`, 'error');
      }
    }

    document.getElementById('activity-table-body')?.addEventListener('click', (e) => {
      const btn = e.target && e.target.closest ? e.target.closest('button[data-act]') : null;
      if (!btn) return;
      const act = btn.getAttribute('data-act');
      if (act === 'revoke') deactivateCode(btn.getAttribute('data-code'));
      else if (act === 'inc10') usersCredits(btn.getAttribute('data-uid'), 'adjust', 10, btn);
      else if (act === 'dec5') usersCredits(btn.getAttribute('data-uid'), 'adjust', -5, btn);
      else if (act === 'custom') customCreditsPrompt(btn.getAttribute('data-uid'), btn.getAttribute('data-balance'));
      else if (act === 'inc') adjustCredits(btn.getAttribute('data-ref'), creditStep);
      else if (act === 'dec') adjustCredits(btn.getAttribute('data-ref'), -creditStep);
    });

    function applyActivityFilter() {
      const q = (document.getElementById('search-activity-input')?.value || '').toLowerCase().trim();
      document.querySelectorAll('#activity-table-body tr').forEach(row => {
        if (!q) { row.style.display = ''; return; }
        row.style.display = (row.dataset.search || row.textContent.toLowerCase()).includes(q) ? '' : 'none';
      });
    }

    document.getElementById('search-activity-input')?.addEventListener('input', applyActivityFilter);

    document.getElementById('btn-toggle-autorefresh')?.addEventListener('click', () => {
      autoRefreshEnabled = !autoRefreshEnabled;
      const dot = document.getElementById('autorefresh-dot');
      const label = document.getElementById('autorefresh-label');
      if (autoRefreshEnabled) {
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
        if (label) label.textContent = '5s';
        startAutoRefresh();
      } else {
        if (dot) dot.className = 'w-2 h-2 rounded-full bg-zinc-600';
        if (label) label.textContent = 'off';
        stopAutoRefresh();
      }
    });

    function startAutoRefresh() {
      stopAutoRefresh();
      refreshIntervalTimer = setInterval(() => { if (autoRefreshEnabled) fetchTelemetry(); }, 5000);
    }

    function stopAutoRefresh() {
      if (refreshIntervalTimer) clearInterval(refreshIntervalTimer);
      refreshIntervalTimer = null;
    }

    document.getElementById('btn-manual-refresh')?.addEventListener('click', fetchTelemetry);

    document.getElementById('btn-admin-logout')?.addEventListener('click', () => {
      deleteCookie('axiom_admin_session');
      activeKey = null;
      window.location.href = '/';
    });

    function showPasskeyModal() {
      stopAutoRefresh();
      const modal = document.getElementById('passkey-modal');
      if (modal) {
        modal.classList.remove('hidden');
        const input = document.getElementById('passkey-input');
        if (input) input.focus();
      }
    }

    document.getElementById('passkey-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const keyVal = document.getElementById('passkey-input').value.trim();
      if (!keyVal) return;
      activeKey = keyVal;
      try {
        const res = await fetch('/api/admin/telemetry', { headers: { 'X-Admin-Key': activeKey } });
        if (res.status === 404 || res.status === 401) {
          document.getElementById('passkey-error').classList.remove('hidden');
          return;
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        setCookie('axiom_admin_session', activeKey);
        document.getElementById('passkey-modal').classList.add('hidden');
        document.getElementById('passkey-error').classList.add('hidden');
        showToast('Admin session authenticated!', 'success');
        renderTelemetry(await res.json());
        if (autoRefreshEnabled) startAutoRefresh();
      } catch (err) {
        document.getElementById('passkey-error').classList.remove('hidden');
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      const key = resolveAdminKey();
      if (!key) {
        showPasskeyModal();
      } else {
        fetchTelemetry();
        startAutoRefresh();
      }
    });
  </script>
</body>
</html>
